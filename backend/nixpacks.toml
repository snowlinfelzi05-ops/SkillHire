[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs_20", "npm-9_x"]

[phases.install]
cmds = ["composer install --no-dev --no-interaction", "npm install"]

[phases.build]
cmds = ["php artisan config:clear", "npm run build || true"]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8080"